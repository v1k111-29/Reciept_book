# Live: the Drunix test network on a GitHub-hosted Linux runner, then the S14_LIVE=1 suite,
# the E3 endorsement check and the headless demo seed. Decision D-33: the runner
# counts as a host machine for G2-G4 evidence when this workflow is green; each step's output
# is kept as an artifact (the logs that quoted it were removed; see git history).
# Drunix is pinned to the commit p3 read on 18 Oct 2026 (network/README.md).
name: live
on:
  workflow_dispatch:
  push:
    branches: ['p1/g2-live-*']

permissions:
  contents: read

env:
  DRUNIX_SHA: 8090e0ce58802c8a0f13d23a6abe5a2d35456cc5

jobs:
  drunix:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    defaults:
      run:
        shell: bash   # -eo pipefail, so a failing command before `| tee` fails its step
    steps:
      - uses: actions/checkout@v4

      - name: Clone Drunix at the pinned commit
        run: |
          git clone --filter=blob:none https://github.com/npci/drunix "$RUNNER_TEMP/drunix"
          git -C "$RUNNER_TEMP/drunix" checkout -q "$DRUNIX_SHA"
          echo "DRUNIX_DIR=$RUNNER_TEMP/drunix" >> "$GITHUB_ENV"

      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ runner.temp }}/drunix/go.mod
          cache-dependency-path: ${{ runner.temp }}/drunix/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v5

      - name: Host facts
        run: |
          uname -a; nproc; free -h; df -h /
          docker version --format 'docker {{.Server.Version}}'
          go version; node --version; jq --version

      - name: Build Drunix host binaries
        working-directory: ${{ runner.temp }}/drunix
        run: |
          make peer orderer configtxgen configtxlator osnadmin cryptogen discover ledgerutil
          ls build/bin

      - name: Standalone docker-compose and node runtime image (network/README.md, ISS-p2-8, ISS-p3-8)
        run: |
          if ! command -v docker-compose >/dev/null; then
            printf '#!/bin/sh\nexec docker compose "$@"\n' | sudo tee /usr/local/bin/docker-compose >/dev/null
            sudo chmod +x /usr/local/bin/docker-compose
          fi
          docker-compose version
          docker pull -q hyperledger/fabric-nodeenv:2.5
          docker tag hyperledger/fabric-nodeenv:2.5 npcioss/fabric-nodeenv:2.5
          for i in peer orderer vscc; do docker pull -q "npcioss/drunix-$i:1.0.0"; done

      - name: network/env.sh
        run: |
          sed "s|^export DRUNIX_DIR=.*|export DRUNIX_DIR=\"$DRUNIX_DIR\"|" network/env.example.sh > network/env.sh
          cat network/env.sh

      - name: Network up (network/up.sh)
        run: bash network/up.sh 2>&1 | tee live-up.log

      - name: Deploy receiptbook (network/deploy.sh)
        run: |
          bash network/deploy.sh 2>&1 | tee live-deploy.log
          cd "$DRUNIX_DIR/drunix-network/test-network"
          export PATH="$PWD/../../build/bin:$PATH" FABRIC_CFG_PATH="$(cd ../config && pwd)"
          set +eu; source ./scripts/envVar.sh >/dev/null 2>&1; setGlobals 1 1 >/dev/null 2>&1; set -eu
          peer lifecycle chaincode querycommitted -C receiptbook -n receiptbook 2>&1 | tee -a "$GITHUB_WORKSPACE/live-deploy.log"

      - name: Install
        run: |
          uv sync
          (cd gateway && npm ci --no-audit --no-fund)

      - name: Gateway
        run: |
          source network/gateway-env.sh
          (cd gateway && nohup npm run dev > ../live-gateway.log 2>&1 &)
          for _ in $(seq 1 60); do curl -fsS localhost:8800/health && exit 0; sleep 2; done
          cat live-gateway.log; exit 1

      - name: Live suite (S14_LIVE=1)
        id: suite
        continue-on-error: true
        run: |
          source network/gateway-env.sh
          S14_LIVE=1 uv run pytest tests/integration -v -rA 2>&1 | tee live-pytest.log
          exit "${PIPESTATUS[0]}"

      - name: E3 endorsement check on receiptbook
        id: e3
        continue-on-error: true
        run: bash scripts/e3_endorsement_check.sh 2>&1 | tee live-e3.log; exit "${PIPESTATUS[0]}"

      - name: Stop the gateway
        if: always()
        run: pkill -f 'tsx src/main.ts' || true

      - name: Browser for the UI smoke test (CI only, not a project dependency)
        run: |
          npm i --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/pw" playwright@1.49.1
          (cd "$RUNNER_TEMP/pw" && npx playwright install --with-deps chromium)

      - name: Demo, headless (scripts/demo.sh, fresh network, seed, UI smoke test)
        id: demo
        continue-on-error: true
        env:
          S14_DEMO_HEADLESS: '1'
          S14_DEMO_CHECK: NODE_PATH=${{ runner.temp }}/pw/node_modules node scripts/ui_smoke.mjs
        run: |
          bash scripts/demo.sh 2>&1 | tee live-demo.log
          # docs/RUNBOOK.md step 4: a fresh network holds exactly the 30 seeded records, 6 per bucket.
          grep -q "loaded 30/30" live-demo.log
          python3 -I - live-demo.log <<'PY'
          import ast, re, sys
          line = re.search(r"on ledger by cause bucket: (\{.*\})", open(sys.argv[1]).read()).group(1)
          counts = ast.literal_eval(line)
          print("on ledger by cause bucket:", counts)
          assert len(counts) == 5 and set(counts.values()) == {6}, counts
          PY

      # VM kit (docs/DEPLOY.md, D-35) on this runner: demo.sh's cleanup stops only its own processes,
      # so the demo's network (with chaincode) is still up and deploy.sh must leave it alone.
      # Port 80 is not used by any earlier step. The password is CI-only (DEPLOY_BASIC_AUTH_PASSWORD).
      - name: Deploy kit (scripts/deploy.sh; checks through Caddy on :80)
        id: deploykit
        continue-on-error: true
        env:
          DEPLOY_BASIC_AUTH_PASSWORD: ci-deploykit-${{ github.run_id }}
        run: |
          {
            pkill -f 'tsx src/main.ts' || true; pkill -f 'uvicorn s14.api' || true; pkill -f vite || true
            bash scripts/deploy.sh up
            bash scripts/deploy.sh status
            U="receiptbook:$DEPLOY_BASIC_AUTH_PASSWORD"
            S=http://127.0.0.1
            echo "== 401 without credentials"
            for p in / /api/health /api/events; do
              code="$(curl -s -o /dev/null -w '%{http_code}' "$S$p")"; echo "$p -> $code"; [ "$code" = 401 ]
            done
            echo "== /api/health"
            curl -fsS -u "$U" "$S/api/health" | python3 -c 'import json,sys; h=json.load(sys.stdin); print(h); assert h["status"]=="ok" and h["contracts_version"]=="1.1.0", h'
            echo "== UI and single-page fallback"
            curl -fsS -u "$U" "$S/" | grep -q "Receipt Book"
            curl -fsS -u "$U" "$S/some/client/route" | grep -q "Receipt Book"
            echo "== create a synthetic record and read it back"
            body="{\"sb_number\":\"DK$(date +%s)\",\"port_code\":\"SYNPORT\",\"sb_date\":\"$(date -u +%F)\"}"
            receipt="$(curl -fsS -u "$U" -H 'Content-Type: application/json' -d "$body" "$S/api/records")"
            sb_hash="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["sb_hash"])' <<<"$receipt")"
            echo "created $sb_hash"
            curl -fsS -u "$U" "$S/api/records/$sb_hash" | python3 -c 'import json,sys; t=json.load(sys.stdin); assert t["record"]["sb_hash"]==sys.argv[1], t; print("read back", t["record"]["sb_hash"], t["assessment"]["bucket"])' "$sb_hash"
            echo "== event stream through Caddy (keep-alive comment within 5 s)"
            rc=0; events="$(curl -sN --max-time 5 -u "$U" "$S/api/events")" || rc=$?
            echo "curl exit $rc"; printf '%s\n' "$events" | head -5
            if [ "$rc" != 28 ] || ! grep -q '^: keep-alive' <<<"$events"; then echo "no keep-alive within 5 s" >&2; exit 1; fi
            echo "== second up: idempotent, salt kept, network untouched"
            salt_before="$(grep '^S14_HASH_SALT=' deploy/.env | sha256sum)"
            DEPLOY_BASIC_AUTH_PASSWORD= bash scripts/deploy.sh up
            [ "$(grep '^S14_HASH_SALT=' deploy/.env | sha256sum)" = "$salt_before" ]
            [ "$(stat -c %a deploy/.env)" = 600 ]
            curl -fsS -u "$U" "$S/api/records/$sb_hash" >/dev/null
            echo "deploy kit OK"
          } 2>&1 | tee live-deploykit.log
          exit "${PIPESTATUS[0]}"

      - name: Container state and logs
        if: always()
        run: |
          mkdir -p live-artifacts/containers
          docker ps -a --format '{{.Names}} {{.Image}} {{.Status}}' | tee live-artifacts/containers.txt
          for c in $(docker ps -a --format '{{.Names}}'); do docker logs "$c" > "live-artifacts/containers/$c.log" 2>&1 || true; done
          if [ -f deploy/.env ]; then   # deploy kit services (the .env itself holds secrets: not copied)
            DEPLOY_UID="$(id -u)" DEPLOY_GID="$(id -g)" DRUNIX_ORGS_DIR="$DRUNIX_DIR/drunix-network/test-network/organizations" \
              docker compose -f deploy/docker-compose.yml --env-file deploy/.env logs --no-color --timestamps > live-deploykit-compose.log 2>&1 || true
            cp deploy/gateway.env live-artifacts/deploykit-gateway.env 2>/dev/null || true   # paths only
          fi
          cp live-*.log live-artifacts/ 2>/dev/null || true
          cp -r .demo-logs live-artifacts/demo-logs 2>/dev/null || true   # upload-artifact skips dot-dirs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-evidence
          path: live-artifacts/
          retention-days: 30

      - name: Result
        if: always()
        run: |
          echo "suite=${{ steps.suite.outcome }} e3=${{ steps.e3.outcome }} demo=${{ steps.demo.outcome }} deploykit=${{ steps.deploykit.outcome }}"
          # Failure summaries as annotations, so they can be read through the API without the log.
          note() { # note <title> <text>: one error annotation, newlines kept
            local text="${2//'%'/%25}"; text="${text//$'\r'/}"; text="${text//$'\n'/%0A}"
            [ -n "$text" ] && echo "::error title=$1::${text:0:3500}"
          }
          if [ "${{ steps.suite.outcome }}" != success ]; then
            note "live suite" "$(grep -E '^(FAILED|ERROR) |^E  |=+ .*(passed|failed|error)' live-pytest.log 2>/dev/null | tail -40)" || true
          fi
          if [ "${{ steps.e3.outcome }}" != success ]; then
            note "endorsement check" "$(tail -15 live-e3.log 2>/dev/null)" || true
          fi
          if [ "${{ steps.demo.outcome }}" != success ]; then
            note "demo" "$(grep -E 'ui: |loaded [0-9]+/|by cause bucket|demo: |Error|Traceback' live-demo.log 2>/dev/null | tail -25)" || true
            note "demo backend log" "$(tail -15 .demo-logs/backend.log 2>/dev/null)" || true
            note "demo gateway log" "$(tail -15 .demo-logs/gateway.log 2>/dev/null)" || true
          fi
          if [ "${{ steps.deploykit.outcome }}" != success ]; then
            note "deploy kit" "$(tail -30 live-deploykit.log 2>/dev/null)" || true
          fi
          [ "${{ steps.suite.outcome }}" = success ] && [ "${{ steps.e3.outcome }}" = success ] && [ "${{ steps.demo.outcome }}" = success ] \
            && [ "${{ steps.deploykit.outcome }}" = success ]
