[project]
name = "s14-receipt-book"
version = "0.1.0"
description = "S14 pilot: shared, time-stamped milestone record per shipping bill on Drunix"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.8",
    "httpx>=0.27",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend", "."]
xfail_strict = true
addopts = "-ra"
